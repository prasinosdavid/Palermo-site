<!doctype html>
<!-- The picture a link to the site unfolds into (Open Graph and Twitter cards), 1200 x 630.
     scripts/build-site.mjs fills the slots, photographs this page once per language with the
     chromium of @playwright/test and writes assets/share-en.jpg and assets/share-el.jpg.
     It is never published as a page. /assets is the built site, /__art is art/renders. -->
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/assets/site.css" />
    <style>
      html,
      body {
        width: 1200px;
        height: 630px;
        min-height: 0;
        overflow: hidden;
      }
      body {
        display: block;
        position: relative;
        background: linear-gradient(180deg, var(--page) 0%, var(--deep) 100%);
      }
      body::before {
        content: none;
      }

      /* The wide render at the height of the picture. Its first coins lie a third of the way in;
         that empty third goes under the words, and the hero's two masks dim it into the velvet. */
      .art {
        position: absolute;
        top: 0;
        left: 150px;
        width: 1290px;
        height: 630px;
        -webkit-mask-image: var(--dim-wide-down);
        mask-image: var(--dim-wide-down);
      }
      .art img {
        width: 100%;
        height: 100%;
        max-width: none;
        -webkit-mask-image: var(--dim-wide-across);
        mask-image: var(--dim-wide-across);
      }

      .words {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 84px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        width: 470px;
      }
      .crest {
        width: 108px;
        height: 108px;
        margin-left: -6px;
        color: var(--gold);
        stroke-width: 2.4;
      }
      /* The app's wordmark in the language of the picture: the lead over the name, neither wrapping.
         The Greek name is the wider of the two; at this size it still ends clear of the first coin. */
      .wordmark {
        display: flex;
        flex-direction: column;
        margin-top: 26px;
        white-space: nowrap;
        font-family: var(--display);
        font-weight: 650;
        font-stretch: 90%;
      }
      .wordmark-top {
        font-size: 22px;
        line-height: 1.4;
        letter-spacing: 0.34em;
        color: var(--gold-text);
      }
      .wordmark-main {
        margin-top: 4px;
        font-size: 88px;
        line-height: 1.05;
        letter-spacing: 0.08em;
      }
      .pip {
        width: 80px;
        height: 10px;
        margin-top: 26px;
        opacity: 0.7;
      }
      .tagline {
        margin-top: 20px;
        font-family: var(--display);
        font-weight: 600;
        font-stretch: 90%;
        font-size: 34px;
        line-height: 1.25;
        text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <div class="art"><img src="/__art/hero-wide.png" alt="" /></div>
    <div class="words">
      {{crest}}
      <div class="wordmark">
        <span class="wordmark-top">{{app: home.wordmarkLead}}</span>
        <span class="wordmark-main">{{app: home.wordmarkName}}</span>
      </div>
      {{pip}}
      <p class="tagline">{{app: home.tagline}}</p>
    </div>
  </body>
</html>
