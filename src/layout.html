<!doctype html>
<!-- Built by scripts/build-site.mjs from site/src/. Edit the source and run npm run site:build. -->
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="theme-color" content="#121018" />
    <meta name="color-scheme" content="dark" />

    <link rel="canonical" href="{{url}}" />
    <link rel="alternate" hreflang="en" href="{{url.en}}" />
    <link rel="alternate" hreflang="el" href="{{url.el}}" />
    <link rel="alternate" hreflang="x-default" href="{{url.en}}" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{app: app.name}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{url}}" />
    <meta property="og:locale" content="{{locale}}" />
    <meta property="og:locale:alternate" content="{{locale.other}}" />
    <meta property="og:image" content="{{share}}" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{word: shareAlt}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{share}}" />
    <meta name="twitter:image:alt" content="{{word: shareAlt}}" />

    <link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="{{root}}assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="{{root}}assets/apple-touch-icon.png" />
{{fonts}}
    <link rel="stylesheet" href="{{root}}assets/site.css" />

    <script>
      // The language rule of the app, for the site. The English page is every page's default
      // address: a reader whose browser lists Greek, or who chose Greek here before, is taken
      // to the Greek page. A choice made with the switch is remembered in this browser and wins.
      // Without JavaScript the switch is an ordinary link and nothing else changes.
      ;(function (lang, greekPage) {
        var KEY = 'palermo.site.lang'
        var chosen = null
        try {
          chosen = localStorage.getItem(KEY)
        } catch (error) {}
        var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']
        var greek = chosen
          ? chosen === 'el'
          : languages.some(function (tag) {
              return /^el/i.test(tag)
            })
        if (lang === 'en' && greek) location.replace(greekPage + location.hash)
        document.addEventListener('click', function (event) {
          var link = event.target.closest ? event.target.closest('a[data-lang]') : null
          if (!link) return
          try {
            localStorage.setItem(KEY, link.getAttribute('data-lang'))
          } catch (error) {}
        })
      })('{{lang}}', '{{to.el}}')
    </script>
  </head>
  <body class="page-{{page}}">
    <a class="skip" href="#content">{{word: skip}}</a>

    <header class="top">
      <a class="brand" href="./" aria-label="{{word: home}}">{{crest}}<span>{{app: app.name}}</span></a>
      <nav class="lang" aria-label="{{word: language}}">
        <a href="{{to.en}}" lang="en" hreflang="en" data-lang="en" aria-label="English"{{current: en}}><span aria-hidden="true">EN</span></a>
        <a href="{{to.el}}" lang="el" hreflang="el" data-lang="el" aria-label="Ελληνικά"{{current: el}}><span aria-hidden="true">ΕΛ</span></a>
      </nav>
    </header>

    <main id="content">
      {{content}}
    </main>

    <footer class="foot">
      <div class="foot-in">
        <a class="brand" href="./" aria-label="{{word: home}}">{{crest}}<span>{{app: app.name}}</span></a>
        <nav aria-label="{{word: footer}}">
          <ul>
            <li><a href="privacy.html"{{current: privacy}}>{{word: privacy}}</a></li>
            <li><a href="support.html"{{current: support}}>{{word: support}}</a></li>
            <li><a href="{{root}}licenses.txt" hreflang="en" type="text/plain">{{word: licences}}</a></li>
            <li><a href="{{to.other}}" lang="{{other}}" hreflang="{{other}}" data-lang="{{other}}">{{word: otherLanguage}}</a></li>
          </ul>
        </nav>
        <p class="fine">© {{developer}}. {{word: trademarks}}</p>
      </div>
    </footer>
  </body>
</html>
